---
- name: "{{ deployment }} - {{ deploy_process }}"
  hosts: "{{ ansible_pull_hosts }}"
  gather_facts: false
  become: true
  vars_files:
    - template_infrastructure_variables_v2.yml
  vars:
    report_dir: "/home/{{ user }}/ansible/reports"
    report_file: "{{ report_dir }}/{{ deploy_process }}_install.json"
  tasks:
    # Create the reports directory before any reporting tasks run.
    - name: Play-00a Create reports directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0700"
      register: play_00a_status

    # Copy the level-specific report template that will be updated by later tasks.
    - name: Play-00b Copy infrastructure report template
      ansible.builtin.copy:
        src: template_report.json
        dest: "{{ report_file }}"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0600"
      register: play_00b_status

    # Populate title and metadata fields so this report is traceable.
    - name: Play-00c Update infrastructure report title block
      ansible.builtin.shell: |
        sed -i "s/^    \"title\":.*/    \"title\": \"{{ deployment }} - {{ deploy_process }}\",/" {{ report_file }} && \
        sed -i "s/^    \"date_time\":.*/    \"date_time\": \"{{ now(utc=true,fmt='%Y-%m-%d %H:%M:%S') }}\",/" {{ report_file }} && \
        sed -i "s/^    \"gen_by\":.*/    \"gen_by\": \"Ansible\",/" {{ report_file }} && \
        sed -i "s/^    \"operator\":.*/    \"operator\": \"Ansible\",/" {{ report_file }} && \
        sed -i "s/^    \"total_entries\":.*/    \"total_entries\": {{ deploy_plays }},/" {{ report_file }}
      changed_when: true
      register: play_00c_status

    # Execute the child cluster template to demonstrate chained template composition.
    - name: Play-01 Execute cluster template
      ansible.builtin.include_tasks: "{{ cluster_playbook }}"
      register: play_01_status

    # Write execution status into report entry 1 for top-level visibility.
    - name: Play-100-01 Generate infrastructure report entry
      ansible.builtin.shell: |
        sed -i "s/^                    \"ent_01_name\":.*/                    \"ent_01_name\": \"cluster-template-execution\",/" {{ report_file }} && \
        sed -i "s/^                    \"ent_01_int_value\":.*/                    \"ent_01_int_value\": {{ play_01_status.rc | default(0) }},/" {{ report_file }} && \
        sed -i "s/^                    \"ent_01_str_value\":.*/                    \"ent_01_str_value\": \"{{ play_01_status.stdout | default('ok') | regex_replace('"', '\\\\"') }}\",/" {{ report_file }} && \
        sed -i "s/^                    \"ent_01_status\":.*/                    \"ent_01_status\": \"{{ 'ok' if (play_01_status.rc | default(0)) == 0 else 'fail' }}\",/" {{ report_file }} && \
        sed -i "s/^                    \"ent_01_timestamp\":.*/                    \"ent_01_timestamp\": \"{{ now(utc=true,fmt='%Y-%m-%d %H:%M:%S') }}\"/" {{ report_file }}
      changed_when: true
      register: play_100_01_status
